bibliography: bibliography/references.bib

format:
  html:
    theme:
      light: [cosmo, styles/styles.scss]
      dark: [darkly, styles/styles-dark.scss]
    # Wide reading column. The margin column now only carries the TOC,
    # so the body gets the space that margin citations used to reserve.
    grid:
      sidebar-width: 290px
      body-width: 1180px
      margin-width: 220px
      gutter-width: 1.6rem
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-sections: true
    number-depth: 3
    code-copy: true
    code-tools: true
    code-overflow: wrap
    code-line-numbers: false
    highlight-style: github
    link-external-newwindow: true
    link-external-icon: true
    # Citations and the bibliography go at the foot of the page, not the margin.
    citation-location: document
    reference-location: document
    link-citations: true
    html-math-method: mathjax
    callout-appearance: simple
    fig-align: center
    fig-responsive: true
    anchor-sections: true
    smooth-scroll: true
    tbl-cap-location: bottom

execute:
  freeze: auto
  echo: true
  warning: false
  message: false
  error: false

crossref:
  fig-title: "Figure"
  tbl-title: "Table"
  eq-prefix: "Equation"
  sec-prefix: "Section"
  def-title: "Definition"
  thm-title: "Theorem"
  lem-title: "Lemma"
  cor-title: "Corollary"
  prp-title: "Proposition"
  exm-title: "Example"
  exr-title: "Exercise"
